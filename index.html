<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:blanchedalmond;
        }
        h1{
            text-align: center;
            line-height: 70px;
        }
        .con{
            height: 550px;
        }
        .top{
            height: 40%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: red;
            border-radius: 10%;
            animation-name: color;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes color{
            0%{
                background-color: red;
            }
            33%{
                background-color: blue;
            }
            66%{
                background-color: green;
            }
            100%{
                background-color: orange;
            }
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color: purple;
            border-radius: 10%;
            animation-name: move;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes move{
            0%{
                transform: translate(0,0);
            }
            33%{
                transform: translate(0,50px);
            }
            66%{
                transform: translate(0,-50px);
            }
            100%{
                transform: translate(0,0);
            }
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color: navy;
            border-radius: 10%;
            animation-name: rotate;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes rotate{
            0%{
                transform: rotate(0deg);
            }
            25%{
                transform: rotate(90deg);
            }
            50%{
                transform: rotate(180deg);
            }
            75%{
                transform: rotate(270deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .box4{
            height: 100px;
            width: 100px;
            background-color: red;
            border-radius: 10%;
            animation-name: pulse;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes pulse{
            0%{
                transform: scale(1);
            }
            50%{
                transform: scale(1.5);
            }
            100%{
                transform: scale(1);
            }
        }
        .box5{
            height: 100px;
            width: 100px;
            background-color: grey;
            border-radius: 10%;
            animation-name: fade;
            animation-duration:0.5s;
            animation-iteration-count: infinite;
        }
        @keyframes fade{
            0%{
                opacity: 1;
            }
            50%{
                opacity: .5;
            }
            100%{
                opacity: 1;
            }
        }
        .box6{
            height: 100px;
            width: 100px;
            border: 10px solid white;
            border-top: 10px solid red;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation-name: vi;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes vi{
            100%{
                transform: rotate(360deg);
            }
        }
        h4{
            text-align: center;
            color: white;
            line-height: 90px;
        }
        .bottom{
            height: 60%;
            width: 100%;
            background-color:blanchedalmond;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .sq{
            height: 300px;
            width: 300px;
            border: 2px dotted black;
            margin-top: 2%;
        }
        .b{
            height: 100px;
            width: 100px;
            background-color: brown;
            /* border-radius: 10%; */
            animation-name: moving;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        }
        @keyframes moving{
            0%{
                transform: translate(0,0);
            }
            25%{
                transform: translate(196px,0);
            }
            50%{
                transform: translate(196px,196px);
            }
            75%{
                transform: translate(0,196px);
            }
            100%{
                transform: translate(0,0);
            }
        }
        .v{
            height: 250px;
            width: 350px;
            gap: 2px;
            border: 2px dotted black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .google{
            height: 50px;
            width: 50px;
            /* border: 1px solid black; */
            border-radius: 50%;
            animation-name: vikash;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        @keyframes vikash{
            0%,100%{
                transform: translate(0);
            }
            33%{
                transform: translate(0,-30px);
            }
        }
        .v1{
            background-color: red;
        }
        .v1{
            background-color: orange;
        }
        .v2{
            background-color: yellow;
            animation-delay: .3s;
        }
        .v3{
            background-color: green;
            animation-delay: .6s;
        }
        .v4{
            background-color: blue;
            animation-delay: .9s;
        }
        .v5{
            background-color: red;
            animation-delay: 1.2s;
        }
        h3{
            position: absolute;
            right: 874px;
            top: 280px;
            margin-top: 1%;
        }
        h2{
            position: absolute;
            right: 320px;
            top: 300px;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="con">
        <h1>CSS Animation Examples </h1>
        <div class="top">
            <div class="box1"><h4>Color</h4></div>
            <div class="box2"><h4>Move</h4></div>
            <div class="box3"><h4>Rotate</h4></div>
            <div class="box4"><h4>Pulse</h4></div>
            <div class="box5"><h4>Fade</h4></div>
            <div class="box6"><h4 style="color: black;">Load</h4></div>
        </div>
        <h3>Square Path Animation</h3>
        <div class="bottom">
            <div class="sq">
                <div class="b"></div>
            </div>
            <div class="v">
                <h2>Google Animation</h2>
                <div class="google v1"></div>
                <div class="google v2"></div>
                <div class="google v3"></div>
                <div class="google v4"></div>
                <div class="google v5"></div>
            </div>
        </div>
    </div>
</body>
</html>
